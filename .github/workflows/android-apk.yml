name: Build Sandhimitra APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
      - 'tools/source-payload/**'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compile debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Reassemble and verify latest Kotlin source
        run: |
          cat tools/source-payload/MainActivity.kt.b64.part* | base64 --decode | gzip --decompress > app/src/main/java/org/sandhimitra/app/MainActivity.kt
          echo "e0f02af528ed042059121ec335f0f5639aea063f8f40a6511f3d6fbf16b4cd14  app/src/main/java/org/sandhimitra/app/MainActivity.kt" | sha256sum --check -
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sandhimitra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
